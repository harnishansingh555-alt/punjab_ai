<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punjab AI | ਪੰਜਾਬ AI</title>
<meta name="theme-color" content="#FFFFFF">
<script>(function(){try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Punjab AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Noto+Sans+Gurmukhi:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--field:#F2BE1A;--ink:#1F2A30;--leaf:#1E5B47;--leaf-2:#2A7A60;--paper:#fff;--mist:#F0F2EE;--line:#E2E6DF;--bg:#fff;--side:#F5F6F2;--muted:#5F6B72;--code:#0F1A20;--shadow:0 6px 24px rgba(19,32,42,.10)}
:root[data-theme="dark"]{--ink:#E8EDEA;--paper:#151D23;--mist:#1E2A31;--line:#2A3740;--bg:#0F1519;--side:#0B1114;--muted:#9AA7AD;--code:#0A1013;--shadow:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Bricolage Grotesque","Noto Sans Gurmukhi",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:284px 1fr;height:100vh;height:100dvh}
/* sidebar */
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;padding:14px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;text-decoration:none;color:inherit}
.brand img{width:36px;height:36px;border-radius:50%}.brand b{font-size:1.2rem;font-weight:800}
.newchat{align-self:flex-start;border:0;border-radius:999px;background:var(--mist);color:var(--ink);font-weight:700;padding:11px 20px;cursor:pointer;transition:background .15s,box-shadow .15s}
.newchat:hover{background:var(--field);color:#13202A;box-shadow:0 4px 14px rgba(232,162,26,.35)}
.clabel{font-size:.78rem;font-weight:700;color:var(--muted);padding:20px 10px 6px}
#chatList{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;border-radius:999px}.ci:hover{background:var(--mist)}.ci.on{background:rgba(242,190,26,.22)}
.ct{flex:1;min-width:0;text-align:left;background:none;border:0;padding:9px 14px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}
.ci.on .ct{font-weight:700}
.cx{background:none;border:0;cursor:pointer;opacity:0;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:1.1rem;margin-right:4px}
.ci:hover .cx,.ci.on .cx{opacity:.8}.cx:hover{background:var(--line);opacity:1}
.empty{color:var(--muted);font-size:.9rem;padding:8px 12px}
.sfoot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.userbox{display:flex;align-items:center;gap:10px;min-width:0}.userbox[hidden]{display:none}
.userbox .info{min-width:0;flex:1}.nm,.em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm{font-weight:700;font-size:.95rem}.em{font-size:.78rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--leaf-2);font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:underline}
:root[data-theme="dark"] .linkbtn{color:var(--field)}
.srow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lang{border-color:var(--line);background:transparent}.lang button{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--field);color:#13202A}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}
.iconbtn:hover{background:var(--mist)}.iconbtn svg{width:20px;height:20px}
.pillbtn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.pillbtn:hover{background:var(--mist)}.pillbtn[aria-pressed="true"]{background:var(--field);border-color:var(--field);color:#13202A}.pillbtn[hidden]{display:none}
/* main */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:10px clamp(12px,3vw,24px)}
#menuBtn{display:none}#barTitle{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#log{flex:1;overflow-y:auto;min-height:0;padding:10px max(16px,calc((100% - 780px)/2)) 20px;display:flex;flex-direction:column;gap:22px;scroll-behavior:auto}
.tobottom{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;padding:0;z-index:4}
.tobottom[hidden]{display:none}.tobottom svg{width:20px;height:20px}
/* welcome */
.welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:20px max(20px,calc((100% - 780px)/2)) 30px;pointer-events:none;overflow-y:auto}
.welcome>*{pointer-events:auto}.has-msgs .welcome{display:none}
#greet{margin:0;font-size:clamp(2rem,6vw,3.3rem);line-height:1.15;font-weight:800;letter-spacing:-.02em}
#greet .hello{display:block;background:linear-gradient(90deg,#E8A21A 0%,#F2BE1A 35%,#2A7A60 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
#greet .how{display:block;color:var(--muted);opacity:.75;font-weight:700}
.welcome .tag{margin:14px 0 0;color:var(--muted);max-width:46ch}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;margin-top:36px}
.chips button{position:relative;border:0;background:var(--mist);border-radius:18px;padding:14px 14px 44px;cursor:pointer;font-size:.95rem;line-height:1.4;text-align:left;min-height:132px;transition:transform .15s,background .15s;color:var(--ink)}
.chips button:hover{background:rgba(242,190,26,.24);transform:translateY(-2px)}
.chips .ico{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:1.05rem}
/* messages */
.row{display:flex;gap:14px;align-items:flex-start;animation:rise .25s ease-out}.row.user{justify-content:flex-end}
.row.user .avatar{display:none}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%;flex:1}
.row.user .stack{align-items:flex-end;flex:0 1 auto;max-width:min(85%,640px)}
.msg{overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.65}
.msg.user{background:var(--mist);padding:11px 18px;border-radius:24px 24px 6px 24px}
.msg.bot{white-space:normal;padding:3px 0 0;font-size:1.02rem;line-height:1.75}
.msg.note{color:var(--muted);font-size:.92rem;padding:4px 0}
.msg.err{background:#FBE9E7;color:#8A1C10;border-radius:14px;padding:10px 14px;align-self:flex-start}
:root[data-theme="dark"] .msg.err{background:#3A1D1A;color:#FFB4A9}
.msg.bot>:first-child{margin-top:0}.msg.bot>:last-child{margin-bottom:0}
.msg p{margin:.55em 0}
.msg h2,.msg h3,.msg h4{margin:1.1em 0 .4em;line-height:1.3;font-weight:800}
.msg h2{font-size:1.3rem}.msg h3{font-size:1.12rem}.msg h4{font-size:1rem}
.msg ul,.msg ol{margin:.5em 0;padding-left:1.5em}.msg li{margin:.25em 0}.msg li>ul,.msg li>ol{margin:.2em 0}
.msg a{color:var(--leaf-2);text-underline-offset:2px}:root[data-theme="dark"] .msg a{color:#6FD1AE}
.msg hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.msg blockquote{margin:.7em 0;padding:.1em 0 .1em 14px;border-left:3px solid var(--field);color:var(--muted)}
.msg code{background:rgba(127,127,127,.18);padding:1px 6px;border-radius:6px;font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.code{margin:.8em 0;border-radius:14px;overflow:hidden;background:var(--code)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 5px 14px;background:rgba(255,255,255,.08);color:#B9C4C9;font-size:.78rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.cc{border:0;background:none;color:#B9C4C9;cursor:pointer;font-size:.8rem;padding:4px 10px;border-radius:8px}.cc:hover{background:rgba(255,255,255,.12);color:#fff}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;color:#EDEBE0;font:.88rem/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
.code pre code{background:none;padding:0;font:inherit;color:inherit}
.tw{overflow-x:auto;margin:.8em 0;border:1px solid var(--line);border-radius:12px}
.msg table{border-collapse:collapse;width:100%;font-size:.95rem;line-height:1.5}
.msg th,.msg td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.msg th{background:var(--mist);font-weight:700}.msg tr:last-child td{border-bottom:0}
.msg.streaming>:last-child:not(.code):not(.tw)::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:3px;background:var(--field);border-radius:3px;vertical-align:text-bottom;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.acts{display:flex;align-items:center;gap:2px;margin-top:6px}.acts[hidden]{display:none}
.act{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.act:hover{background:var(--mist);color:var(--ink)}.act[aria-pressed="true"]{color:var(--leaf-2);background:var(--mist)}
.act svg{width:19px;height:19px}
.row:not(.last) .regen,.row[data-img] .regen{display:none}
.row .avatar{width:30px;height:30px;font-size:.85rem}
.row .avatar.ai{background:#071C4A;padding:0;overflow:hidden;border-radius:50%;flex:none;display:block;margin-top:3px}.row .avatar.ai img{width:30px;height:30px;display:block}
.row.thinking .avatar.ai{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,190,26,.55)}50%{box-shadow:0 0 0 7px rgba(242,190,26,0)}}
.think{display:flex;flex-direction:column;gap:9px;width:min(560px,78vw);padding:8px 0 4px}
.think i{display:block;height:13px;border-radius:7px;background:linear-gradient(90deg,var(--mist) 20%,rgba(242,190,26,.45) 50%,var(--mist) 80%);background-size:300% 100%;animation:sk 1.5s linear infinite}
.think i:nth-child(1){width:94%}.think i:nth-child(2){width:80%}.think i:nth-child(3){width:52%}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
/* composer */
.composer{padding:6px clamp(12px,3vw,24px) 12px}
.cbox{max-width:780px;margin:0 auto;background:var(--mist);border:1.5px solid transparent;border-radius:30px;padding:10px 12px 8px 16px;transition:background .15s,box-shadow .15s,border-color .15s}
.cbox:focus-within{background:var(--paper);border-color:var(--line);box-shadow:var(--shadow)}
.cbox .tray{padding:2px 0 8px}
#form{display:block;padding:0;border:0;background:none}
#input{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:1.03rem;padding:6px 2px 8px;max-height:180px;line-height:1.5}
#input::placeholder{color:var(--muted)}
.ctools{display:flex;align-items:center;gap:6px}.ctools .sp{flex:1}
.tool{flex:none;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;border:0;background:transparent;color:var(--ink);transition:transform .15s,background .15s}
.tool:hover{background:rgba(127,127,127,.18)}
.tool svg{width:23px;height:23px;display:block;overflow:visible}
#imgBtn{background:linear-gradient(135deg,#FFE08A,#F2BE1A 45%,#E8841A);box-shadow:0 3px 10px rgba(232,132,26,.3)}
#imgBtn:hover{transform:scale(1.07)}
#imgBtn[aria-pressed="true"]{background:linear-gradient(135deg,#2A7A60,#1E5B47);box-shadow:0 0 0 3px rgba(242,190,26,.9)}
#imgBtn .spark{transform-origin:center;transform-box:fill-box;animation:twinkle 2.2s ease-in-out infinite}#imgBtn .spark2{animation-delay:1.1s}
@keyframes twinkle{0%,100%{transform:scale(.75) rotate(0);opacity:.7}50%{transform:scale(1.15) rotate(18deg);opacity:1}}
.mic{width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.mic:hover{background:rgba(127,127,127,.18)}.mic svg,.send svg{width:21px;height:21px}
.mic[aria-pressed="true"]{background:#B3261E;color:#fff;animation:pulse 1.2s infinite}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--field);color:#13202A;cursor:pointer;display:grid;place-items:center;padding:0;transition:opacity .15s,transform .15s}
.send:hover{filter:brightness(1.06)}.send.idle{opacity:.4}.send:disabled{opacity:.5;cursor:default}
.send.stop{background:var(--ink);color:var(--paper);opacity:1}
.hint{text-align:center;font-size:.76rem;color:var(--muted);margin:8px 0 0}
.tray{display:flex;flex-wrap:wrap;gap:8px}.tray:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px 6px;font-size:.88rem;font-weight:600;animation:rise .2s ease-out;color:var(--ink)}
.pill .th{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.pill .ic{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--mist);font-size:.68rem;font-weight:800;color:var(--leaf-2);letter-spacing:.03em}
.pill .nm{min-width:0;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.pill button{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:rgba(127,127,127,.2);color:var(--ink);cursor:pointer;font-size:.95rem;line-height:1;padding:0}
.pill button:hover{background:var(--ink);color:var(--paper)}
.pill.mode{background:linear-gradient(135deg,#FFF3C4,#FFE08A);border-color:#EBD58A;padding:7px 8px 7px 12px;color:#13202A}
.pill.mode button{color:#13202A}
.msg .att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .att img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.msg .att span{font-size:.82rem;background:rgba(127,127,127,.2);border-radius:8px;padding:3px 9px}
.shim{display:flex;flex-direction:column;gap:10px;min-width:min(260px,70vw)}
.shim .box{aspect-ratio:1;border-radius:16px;background:linear-gradient(110deg,var(--mist) 30%,rgba(242,190,26,.4) 50%,var(--mist) 70%);background-size:220% 100%;animation:shine 1.4s linear infinite;display:grid;place-items:center}
.shim .box svg{width:46px;height:46px;opacity:.55}
.shim .tx{font-size:.92rem;color:var(--muted);font-weight:600}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.msg .genimg{box-shadow:0 8px 24px rgba(19,32,42,.16);width:min(100%,420px);border-radius:16px;display:block;margin-top:8px}
.msg .dl{display:inline-block;margin-top:10px;background:var(--leaf);color:#fff;border-radius:999px;padding:6px 14px;text-decoration:none}
.msg .dl:hover{background:var(--leaf-2)}
.dragging .main{outline:3px dashed var(--field);outline-offset:-10px}
/* gate */
.gate{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:var(--bg)}.gate[hidden]{display:none}
.gate .box{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:clamp(24px,4vw,40px);max-width:430px;width:100%;text-align:center;box-shadow:var(--shadow)}
.gate img{width:72px;height:72px;border-radius:50%}.gate h2{margin:12px 0 6px;font-size:1.6rem;line-height:1.2}
.gate p{margin:0 0 20px;color:var(--muted)}.gate #gbtn{display:flex;justify-content:center;min-height:44px}
.gate .small{margin:16px 0 0;font-size:.82rem}.gate .err{color:#8A1C10;background:#FBE9E7;border-radius:10px;padding:8px 12px;margin:14px 0 0;font-size:.9rem}.gate .err[hidden]{display:none}
.gate .lang{margin-top:18px}
.scrim{display:none}
/* live voice */
.live{position:absolute;inset:0;z-index:6;background:radial-gradient(circle at 50% 35%,#1E5B47,#0f2e25 72%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom));text-align:center}
.live[hidden]{display:none}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE08A,#F2BE1A 55%,#D39A0A);cursor:pointer;border:0;padding:0}
.live[data-state="listening"] .orb{animation:orbL 1.6s infinite}
.live[data-state="thinking"] .orb{animation:orbT 1s infinite ease-in-out;opacity:.85}
.live[data-state="speaking"] .orb{animation:orbS .8s infinite ease-in-out}
@keyframes orbL{0%{box-shadow:0 0 0 0 rgba(242,190,26,.55)}100%{box-shadow:0 0 0 46px rgba(242,190,26,0)}}
@keyframes orbT{0%,100%{transform:scale(.94)}50%{transform:scale(1.02)}}
@keyframes orbS{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.lstate{font-weight:700;font-size:1.3rem}
.ltext{max-width:36ch;min-height:3.2em;max-height:30vh;overflow:auto;opacity:.92;font-size:1.05rem}
.lend{font:inherit;font-weight:700;border:2px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:10px 26px;cursor:pointer}
.lend:hover{background:#fff;color:#13202A}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}100%{box-shadow:0 0 0 14px rgba(179,38,30,0)}}
@media (max-width:980px){.chips{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(86vw,320px);transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow)}
 .app.open .side{transform:none}.app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
 #menuBtn{display:grid}
}
@media (max-width:520px){
 .bar .pillbtn{padding:6px 11px;font-size:.82rem}
 #voiceOut{font-size:0;padding:6px 12px}#voiceOut::before{content:"🔇";font-size:1rem}#voiceOut[aria-pressed="true"]::before{content:"🔊"}
 .chips{gap:8px}.chips button{min-height:112px;padding:12px 12px 42px;font-size:.9rem}
 .row{gap:10px}.orb{width:130px;height:130px}
 .tool,.mic{width:38px;height:38px}
}
</style>
</head>
<body>

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(t) {
  const codes = [];
  t = String(t).replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = esc(t);
  t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, a, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${a}</a>`);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)]*[^\s<).,;:!?])/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  t = t.replace(/\*\*([^*\n]+?)\*\*/g, "<b>$1</b>")
       .replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, "$1<i>$2</i>")
       .replace(/~~([^~\n]+)~~/g, "<s>$1</s>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[i]) + "</code>");
}
function codeBlock(cl, code) {
  return `<div class="code"><div class="ch"><span>${esc(cl || "code")}</span><button type="button" class="cc">${esc(T[lang].copy)}</button></div><pre><code>${esc(code)}</code></pre></div>`;
}
const LI = /^(\s*)([-*+•]|\d+[.)])\s+(.*)/;
function renderMd(src) {
  const L = String(src).replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const isSep = (l) => !!l && l.includes("|") && l.includes("-") && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const startsBlock = (l, nx) => /^\s*```/.test(l) || /^#{1,6}\s+/.test(l) || LI.test(l) || /^\s*>/.test(l) || /^\s*([-*_])(\s*\1){2,}\s*$/.test(l) || (l.includes("|") && isSep(nx));
  while (i < L.length) {
    const line = L[i]; let m;
    if ((m = line.match(/^\s*```+\s*([\w+#.-]*)/))) {
      const buf = []; i++;
      while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++; out.push(codeBlock(m[1], buf.join("\n"))); continue;
    }
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { const n = m[1].length <= 2 ? 2 : m[1].length === 3 ? 3 : 4; out.push(`<h${n}>${inline(m[2].replace(/\s*#+\s*$/, ""))}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + renderMd(buf.join("\n")) + "</blockquote>"); continue;
    }
    if (line.includes("|") && isSep(L[i + 1])) {
      const head = cells(line); i += 2;
      let h = "<div class=\"tw\"><table><thead><tr>" + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
      while (i < L.length && L[i].trim() && L[i].includes("|")) { const r = cells(L[i++]); h += "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>"; }
      out.push(h + "</tbody></table></div>"); continue;
    }
    if (LI.test(line)) {
      const st = []; let h = "";
      while (i < L.length) {
        const mm = L[i].match(LI);
        if (!mm) {
          if (!L[i].trim() && i + 1 < L.length && LI.test(L[i + 1])) { i++; continue; }
          if (L[i].trim() && /^\s{2,}\S/.test(L[i]) && st.length) { h += "<br>" + inline(L[i].trim()); i++; continue; }
          break;
        }
        const ind = mm[1].replace(/\t/g, "    ").length, ty = /\d/.test(mm[2][0]) ? "ol" : "ul";
        while (st.length && ind < st[st.length - 1].ind) h += "</li></" + st.pop().ty + ">";
        const top = st[st.length - 1];
        if (!top || ind > top.ind) { const n = parseInt(mm[2], 10); h += "<" + ty + (ty === "ol" && n > 1 ? ` start="${n}"` : "") + ">"; st.push({ ty, ind }); }
        else { h += "</li>"; if (top.ty !== ty) { h += "</" + st.pop().ty + "><" + ty + ">"; st.push({ ty, ind }); } }
        h += "<li>" + inline(mm[3]); i++;
      }
      while (st.length) h += "</li></" + st.pop().ty + ">";
      out.push(h); continue;
    }
    const buf = [line]; i++;
    while (i < L.length && L[i].trim() && !startsBlock(L[i], L[i + 1])) buf.push(L[i++]);
    out.push("<p>" + buf.map(inline).join("<br>") + "</p>");
  }
  return out.join("");
}

let speakOn = false, listening = false, rec = null, imageMode = false, liveOn = false, liveRec = null, liveFails = 0;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canSpeak = "speechSynthesis" in window;

function refreshVoiceLabels() {
  const t = T[lang];
  $("mic").innerHTML = listening ? SVG_STOP : SVG_MIC;
  $("mic").title = listening ? t.micStop : t.mic; $("mic").setAttribute("aria-label", listening ? t.micStop : t.mic);
  $("mic").setAttribute("aria-pressed", String(listening));
  $("voiceOut").textContent = speakOn ? t.speakOn : t.speakOff;
  $("voiceOut").setAttribute("aria-pressed", String(speakOn));

  $("lend").textContent = t.liveEnd;
  $("installBtn").textContent = "📲 " + t.install;
  if (typeof setLive === "function" && !$("live").hidden) setLive($("live").dataset.state);
  if (!listening) input.placeholder = imageMode ? t.imagePh : t.placeholder;
  $("attachBtn").title = t.attach; $("attachBtn").setAttribute("aria-label", t.attach);
  $("imgBtn").title = t.image; $("imgBtn").setAttribute("aria-label", t.image);
  $("imgBtn").setAttribute("aria-pressed", String(imageMode));

function speakable(t) {
  return String(t).replace(/```[\s\S]*?```/g, " ").replace(/[`*_#>]/g, "").replace(/^\s*[-•]\s+/gm, "").replace(/\s+/g, " ").trim();
}
// Speaks the text and resolves when finished. force=true speaks even when "Voice replies" is off (live mode).
function say(text, force = false) {
  return new Promise((resolve) => {
    if ((!speakOn && !force) || !canSpeak) return resolve();
    speechSynthesis.cancel();
    const clean = speakable(text);
    if (!clean) return resolve();
    const pa = /[\u0A00-\u0A7F]/.test(clean);
    const voices = speechSynthesis.getVoices();
    const norm = (v) => v.lang.replace("_", "-").toLowerCase();
    const voice = pa
      ? voices.find((v) => norm(v).startsWith("pa"))
      : voices.find((v) => norm(v) === "en-in") || voices.find((v) => norm(v).startsWith("en"));
    if (pa && voices.length && !voice) { add(T[lang].noPa, "note"); return resolve(); }
    // Long text is spoken in pieces, because some browsers cut off a single long utterance.
    const chunks = [];
    for (const piece of clean.match(/[^.!?।]+[.!?।]*\s*/g) || [clean]) {
      if (chunks.length && chunks[chunks.length - 1].length + piece.length < 180) chunks[chunks.length - 1] += piece;
      else chunks.push(piece);
    }
    chunks.forEach((c, i) => {
      const u = new SpeechSynthesisUtterance(c);
      u.lang = pa ? "pa-IN" : "en-IN";
      if (voice) u.voice = voice;
      if (i === chunks.length - 1) { u.onend = resolve; u.onerror = resolve; }
      speechSynthesis.speak(u);
    });
  });
}

function toggleMic() {
  if (!SR) { add(T[lang].noMic, "err"); return; }
  if (listening) { rec.stop(); return; }
  if (canSpeak) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = lang === "pa" ? "pa-IN" : "en-IN";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => { listening = true; input.placeholder = T[lang].listening; refreshVoiceLabels(); };
  rec.onresult = (e) => {
    let txt = "";
    for (const r of e.results) txt += r[0].transcript;
    input.value = txt;
  };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") add(T[lang].micDenied, "err");
  };
  rec.onend = () => {
    listening = false;
    input.placeholder = T[lang].placeholder;
    refreshVoiceLabels();
    const v = input.value.trim();
    if (v) send(v);
  };
  rec.start();
}

// Send button: arrow normally, a stop square while an answer is being written.
const SVG_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const SVG_HALT = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>';
let abortCtl = null;
function setBusy(b, stoppable = true) {
  sendBtn.classList.toggle("stop", b && stoppable);
  sendBtn.innerHTML = b && stoppable ? SVG_HALT : SVG_SEND;
  sendBtn.disabled = b && !stoppable;

async function send(text, opts = {}) {
  text = (text || "").trim();
  if (!user) { showGate(); return; }
  const files = !opts.live ? pending.slice() : [];
  if ((!text && !files.length) || busy) return;
  if (!text) text = T[lang].fileDefault;
  if (!opts.live && !files.length) {
    const m = text.match(/^\/(?:image|img)\s+([\s\S]+)/i);
    if (m) return sendImage(m[1]);
    if (imageMode) return sendImage(text);
  }
  if (canSpeak) speechSynthesis.cancel();
  // Text files go inside the message; pictures and PDFs travel as attachments.
  const fileText = files.filter((f) => f.kind === "text").map((f) => `\n\n[File: ${f.name}]\n${f.text}`).join("");
  const att = files.filter((f) => f.kind !== "text").map((f) => ({ mime: f.mime, data: f.data }));
  const shown = files.length ? text + "\n" + files.map((f) => "📎 " + f.name).join("\n") : text;
  history.push({ role: "user", content: text + fileText, shown: files.length ? shown : undefined, att: att.length ? att : undefined });
  syncWelcome();
  const ub = add(text, "user");
  if (files.length) {
    const box = document.createElement("div"); box.className = "att";
    files.forEach((f) => {
      if (f.thumb) { const im = new Image(); im.src = f.thumb; im.alt = f.name; box.append(im); }
      else { const sp = document.createElement("span"); sp.textContent = "📎 " + f.name; box.append(sp); }
    });
    ub.append(box);
    pending = []; renderTray();
  }
  $("chips").innerHTML = "";
  input.value = "";
  input.style.height = "auto";
  // If the answer fails or is stopped before anything arrives, the question goes back into the box.
  const undo = () => {
    history.pop(); removeMsg(ub); syncWelcome(); renderChips();
    if (!opts.live) { input.value = text === T[lang].fileDefault ? "" : text; if (files.length) { pending = files; renderTray(); } input.dispatchEvent(new Event("input")); }
  };
  return respond(opts, undo);
}

// Writes the answer to the last message in `history`.
async function respond(opts = {}, undo = () => {}) {
  busy = true; setBusy(true);
  stick = true;
  const wait = typingIndicator();
  const ctl = (abortCtl = new AbortController());
  let bubble = null, full = "", raf = 0;
  const paint = () => { raf = 0; if (bubble) { bubble.innerHTML = renderMd(full); bubble._text = full; toBottom(); } };
  try {
    const k = (() => { let k = -1; history.forEach((m, i) => { if (m.att) k = i; }); return k; })();
    const res = await fetch("api/chat", {
      method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.map((m, i) => ({ role: m.role, content: m.content, ...(i === k ? { attachments: m.att } : {}) })), lang, voice: !!opts.live, stream: true })
    });
    if (res.status === 401) { wait.remove(); undo(); user = null; renderUser(); showGate(); return null; }
    if (!(res.headers.get("content-type") || "").includes("text/event-stream")) {
      const data = await res.json();
      wait.remove();
      if (!res.ok || !data.reply) throw new Error(data.error || "Request failed");
      full = data.reply; finishBot(add(full, "bot"));
    } else {
      // Words arrive as they are written, so the first words show up in a moment.
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "", failed = null;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
          if (!line.startsWith("data:")) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
          if (ev.error) failed = ev.error;
          if (ev.d) {
            full += ev.d;
            if (!bubble) { wait.remove(); bubble = add("", "bot", { stream: true }); }
            if (!raf) raf = requestAnimationFrame(paint);
          }
        }
      }
      if (raf) cancelAnimationFrame(raf);
      wait.remove();
      if (bubble) { paint(); finishBot(bubble); }
      if (!full.trim()) throw new Error(failed || "Request failed");
    }
    history.push({ role: "assistant", content: full });
    saveChat(); markLast();
    if (!opts.live) say(full);
    return full;
  } catch (e) {
    if (raf) cancelAnimationFrame(raf);
    wait.remove();
    if (bubble && full.trim()) { // keep what already arrived (also after Stop)
      paint(); finishBot(bubble);
      history.push({ role: "assistant", content: full }); saveChat(); markLast(); return full;
    }
    if (bubble) removeMsg(bubble);
    undo();
    if (ctl.signal.aborted) return null;
    add(location.protocol === "file:" ? T[lang].fileNote : e.message && e.message !== "Request failed" && !/fetch|NetworkError|Failed to/i.test(e.message) ? e.message : T[lang].error, "err");
    return null;
  } finally {
    busy = false; abortCtl = null;
    setBusy(false);
    if (!opts.live) input.focus();
  }
}

// Answer again: drops the last answer and asks the same question once more.
function regenerate() {
  if (busy || !history.length || history[history.length - 1].role !== "assistant") return;
  const prev = history.pop();
  const rows = [...log.querySelectorAll(".row.bot")].filter((r) => r.querySelector(".acts"));
  const old = rows[rows.length - 1]; if (old) old.remove();
  if (canSpeak) speechSynthesis.cancel();
  respond({}, () => { history.push(prev); finishBot(add(prev.content, "bot")); });
}

// ---------- image generation ----------
async function sendImage(prompt) {
  prompt = (prompt || "").trim();
  if (!user) { showGate(); return; }
  if (!prompt || busy) return;
  busy = true; setBusy(true, false);
  imageMode = false;
  refreshVoiceLabels();
  const label = "🎨 " + prompt;
  history.push({ role: "user", content: label });
  syncWelcome();
  add(label, "user");
  $("chips").innerHTML = "";
  input.value = "";
  input.style.height = "auto";
  const wait = typingIndicator();
  const wm = wait.querySelector(".msg");
  wm.innerHTML = '<div class="shim"><div class="box"><svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="16" rx="4" fill="#1E5B47"/><circle cx="8.2" cy="9.4" r="2.1" fill="#F2BE1A"/><path d="M3.5 17.2l4.6-4.9a1.3 1.3 0 0 1 1.9 0l2.4 2.5 2.1-2.2a1.3 1.3 0 0 1 1.9 0l4.1 4.4v.7a2.5 2.5 0 0 1-2.5 2.3H6a2.5 2.5 0 0 1-2.5-2.5z" fill="#F2BE1A"/></svg></div><div class="tx"></div></div>';
  const wtx = wm.querySelector(".tx"); wtx.textContent = T[lang].imgMaking;
  try {
    const start = await fetch("api/image/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });
    const first = await start.json();
    if (start.status === 401) { wait.remove(); history.pop(); syncWelcome(); user = null; renderUser(); showGate(); return; }
    if (!start.ok || (!first.id && !first.image)) throw new Error(first.error || "Request failed");
    let data = first.image ? first : null;     // Google answered straight away
    for (let i = 0; !data && i < 100; i++) {          // wait up to about 5 minutes
      await new Promise((ok) => setTimeout(ok, 3000));
      const pr = await fetch("api/image/status/" + first.id);
      const p = await pr.json();
      if (pr.status === 401) { wait.remove(); history.pop(); syncWelcome(); user = null; renderUser(); showGate(); return; }
      if (p.state === "error") throw new Error(p.error || "Request failed");
      if (p.state === "done") { data = p; break; }
      if (p.queue != null) wtx.textContent = T[lang].imgMaking + " · " + T[lang].queue(p.queue) + (p.eta ? " · ~" + p.eta + "s" : "");
    }
    wait.remove();
    if (!data) throw new Error("The image is taking too long. Please try again.");
    const el = add(data.text || T[lang].imageDone, "bot");
    el._row.dataset.img = "1";
    const img = new Image();
    img.onload = () => { log.scrollTop = log.scrollHeight; };
    img.src = data.image; img.alt = prompt; img.className = "genimg";
    const dl = document.createElement("a");
    dl.href = data.image; dl.download = "punjab-ai-image.png"; dl.className = "dl"; dl.textContent = "⬇ " + T[lang].download;
    el.append(img, dl);
    log.scrollTop = log.scrollHeight;
    history.push({ role: "assistant", content: T[lang].imageDone + " (" + prompt + ")" });
    saveChat(); markLast();
  } catch (e) {
    wait.remove();
    history.pop(); syncWelcome();
    add(location.protocol === "file:" ? T[lang].fileNote : e.message && e.message !== "Request failed" && !/fetch/i.test(e.message) ? e.message : T[lang].error, "err");
  } finally {
    busy = false; setBusy(false);
    input.focus();
  }
}

// ---------- attach files + image mode ----------
let pending = [];
const MAX_FILES = 4, MAX_BYTES = 5 * 1024 * 1024, MAX_TEXT = 15000;
const TEXT_EXT = /\.(txt|md|csv|json|html|css|js|py|xml|log|ya?ml|sql|java|c|cpp)$/i;

function renderTray() {
  const tray = $("tray");
  if (!tray) return;
  tray.innerHTML = "";
  if (imageMode) {
    const m = document.createElement("div"); m.className = "pill mode";
    const tx = document.createElement("span"); tx.textContent = "🎨 " + T[lang].imageOn;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.title = T[lang].remove;
    x.onclick = () => { imageMode = false; refreshVoiceLabels(); input.focus(); };
    m.append(tx, x); tray.append(m);
  }
  pending.forEach((f, i) => {
    const p = document.createElement("div"); p.className = "pill";
    if (f.thumb) { const im = new Image(); im.src = f.thumb; im.className = "th"; im.alt = ""; p.append(im); }
    else { const ic = document.createElement("div"); ic.className = "ic"; ic.textContent = f.kind === "pdf" ? "PDF" : "TXT"; p.append(ic); }
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = f.name;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.title = T[lang].remove; x.setAttribute("aria-label", T[lang].remove);
    x.onclick = () => { pending.splice(i, 1); renderTray(); };
    p.append(nm, x); tray.append(p);
  });
  if (typeof updateSend === "function") updateSend();
}

const readAs = (file, how) => new Promise((ok, bad) => {
  const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => bad(r.error);
  how === "text" ? r.readAsText(file) : r.readAsDataURL(file);
});

// Pictures are shrunk first so they upload quickly on a phone connection.
async function shrinkImage(file) {
  const url = await readAs(file, "url");
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  const full = c.toDataURL("image/jpeg", 0.85);
  const t = document.createElement("canvas"); const ts = 96 / Math.max(img.width, img.height, 96);
  t.width = Math.round(img.width * ts) || 96; t.height = Math.round(img.height * ts) || 96;
  t.getContext("2d").drawImage(img, 0, 0, t.width, t.height);
  return { data: full.split(",")[1], thumb: t.toDataURL("image/jpeg", 0.7) };
}

async function addFiles(list) {
  for (const file of Array.from(list || [])) {
    if (pending.length >= MAX_FILES) { add(T[lang].tooMany, "err"); break; }
    try {
      if (file.type.startsWith("image/")) {
        if (file.size > 25 * 1024 * 1024) { add(T[lang].tooBig, "err"); continue; }
        const r = await shrinkImage(file);
        pending.push({ kind: "image", name: file.name || "image.jpg", mime: "image/jpeg", data: r.data, thumb: r.thumb });
      } else if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
        if (file.size > MAX_BYTES) { add(T[lang].tooBig, "err"); continue; }
        const d = await readAs(file, "url");
        pending.push({ kind: "pdf", name: file.name, mime: "application/pdf", data: d.split(",")[1] });
      } else if (file.type.startsWith("text/") || TEXT_EXT.test(file.name) || file.type === "application/json") {
        if (file.size > 2 * 1024 * 1024) { add(T[lang].tooBig, "err"); continue; }
        const txt = (await readAs(file, "text")).slice(0, MAX_TEXT);
        pending.push({ kind: "text", name: file.name, text: txt });
      } else { add(T[lang].badType, "err"); }
    } catch (e) { add(T[lang].badType, "err"); }
  }
  renderTray();
}

$("attachBtn").onclick = () => $("file").click();
$("file").onchange = async (e) => { await addFiles(e.target.files); e.target.value = ""; input.focus(); };
$("imgBtn").onclick = () => { imageMode = !imageMode; refreshVoiceLabels(); input.focus(); };
input.addEventListener("paste", (e) => {
  const files = Array.from(e.clipboardData?.files || []).filter((f) => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addFiles(files); }
});
["dragenter", "dragover"].forEach((ev) => window.addEventListener(ev, (e) => { if (e.dataTransfer?.types?.includes("Files")) { e.preventDefault(); document.body.classList.add("dragging"); } }));
["dragleave", "drop"].forEach((ev) => window.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.remove("dragging"); if (ev === "drop") addFiles(e.dataTransfer?.files); }));

// ---------- live voice mode: listen, answer, speak, listen again ----------
function setLive(state, text) {
  $("live").dataset.state = state;
  $("lstate").textContent = T[lang]["live_" + state] || "";
  if (text !== undefined) $("ltext").textContent = text;
}
function startLive() {
  if (!SR) { add(T[lang].noMic, "err"); return; }
  if (!$("gate").hidden) return;
  if (listening && rec) { try { rec.abort(); } catch (e) {} }
  liveOn = true; liveFails = 0;
  $("live").hidden = false;
  if (canSpeak) speechSynthesis.cancel();
  liveListen();
}
function stopLive() {
  liveOn = false;
  const r = liveRec; liveRec = null;
  try { r && r.abort(); } catch (e) {}
  if (canSpeak) speechSynthesis.cancel();
  $("live").hidden = true;
}
function liveListen() {
  if (!liveOn) return;
  const r = new SR();
  liveRec = r;
  r.lang = lang === "pa" ? "pa-IN" : "en-IN";
  r.interimResults = true;
  r.continuous = false;
  let heard = "";
  r.onstart = () => setLive("listening", "");
  r.onresult = (e) => {
    let t = "";
    for (const x of e.results) t += x[0].transcript;
    heard = t;
    $("ltext").textContent = t;
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { add(T[lang].micDenied, "err"); stopLive(); }
  };
  r.onend = async () => {
    if (!liveOn || liveRec !== r) return;
    const v = heard.trim();
    if (!v) {
      if (++liveFails >= 6) { stopLive(); return; } // about a minute of silence ends live mode
      setTimeout(liveListen, 300);
      return;
    }
    liveFails = 0;
    setLive("thinking", v);
    const reply = await send(v, { live: true });
    if (!liveOn) return;
    if (!$("gate").hidden) { stopLive(); return; }
    if (!reply) { setLive("error", ""); setTimeout(liveListen, 1800); return; }
    setLive("speaking", speakable(reply));
    await say(reply, true);
    if (liveOn) liveListen();
  };
  try { r.start(); } catch (e) { setTimeout(liveListen, 500); }
}

function paintTheme(t) {
  document.documentElement.dataset.theme = t;
  $("themeBtn").innerHTML = t === "dark" ? SVG_SUN : SVG_MOON;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "dark" ? "#0F1519" : "#F2BE1A";
}
$("themeBtn").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("theme", t); } catch (e) {}
  paintTheme(t);
});
$("menuBtn").addEventListener("click", () => $("app").classList.toggle("open"));
$("scrim").addEventListener("click", closeDrawer);
paintTheme(document.documentElement.dataset.theme || "light");

$("form").addEventListener("submit", (e) => { e.preventDefault(); if (busy && abortCtl) { abortCtl.abort(); return; } send(input.value); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
  updateSend();
});
document.querySelectorAll(".lang button").forEach((b) =>
  b.addEventListener("click", () => {
    lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (e) {}
    applyLang();
    if (!$("gate").hidden) showGate();
  }));
$("reset").addEventListener("click", () => reset());
$("mic").addEventListener("click", toggleMic);
$("liveBtn").addEventListener("click", startLive);
// "Install app" button (Android / Chrome / Edge). iPhone: Share > Add to Home Screen.
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
window.addEventListener("appinstalled", () => { installEvt = null; $("installBtn").hidden = true; });
$("installBtn").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; $("installBtn").hidden = true;
});
$("lend").addEventListener("click", stopLive);
$("orb").addEventListener("click", () => { if ($("live").dataset.state === "speaking" && canSpeak) speechSynthesis.cancel(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && liveOn) stopLive(); });
$("voiceOut").addEventListener("click", () => {
  speakOn = !speakOn;
  if (!speakOn && canSpeak) speechSynthesis.cancel();
  refreshVoiceLabels();
});

(async function start() {
  setBusy(false);
  applyLang();
  const st = await PAI.load();
  user = st.user;
  if (!user) showGate();
  restore();
  applyLang();
  // Deep links from the Image and Live voice pages: chat.html?mode=image or ?mode=live
  const mode = new URLSearchParams(location.search).get("mode");
  if (mode === "live" && user) setTimeout(startLive, 400);
  if (mode === "image") { imageMode = true; refreshVoiceLabels(); input.focus(); }
})();
</script>
</body>
</html>
